<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Hold to Scan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- STAGE 1: Hold-to-scan fingerprint -->
    <main id="stage-scan" class="stage active">
        <div class="scan">
            <div id="fingerprint" class="fingerprint" role="button" aria-label="Hold your thumb here to scan"></div>
            <h3 id="status" class="status idle">Hold to scan</h3>
            <p class="progress-text"><span id="percent">0</span>%</p>
        </div>
        <div id="flash" class="flash"></div>
    </main>

    <!-- STAGE 2: Message shown after the scan completes -->
    <main id="stage-message" class="stage">
        <h3 class="status message">Yeah she is 1000% the dragon warrior who is going to clock bestie</h3>
    </main>

    <!-- STAGE 3: Placeholder for the next animation -->
    <main id="stage-next" class="stage">
        <div class="placeholder">
            <h2>Next animation goes here</h2>
            <p>Placeholder for stage 2</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
